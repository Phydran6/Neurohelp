name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Formatierung prüfen
        run: dart format --output=none --set-exit-if-changed .

      - name: Statische Analyse
        run: |
          set +e
          flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          # Bei Fehlern die vollständige Ausgabe als Annotation anhängen:
          # so steht sie direkt am Job und im Pull Request, ohne dass
          # jemand das komplette Log öffnen muss.
          if [ "$code" -ne 0 ]; then
            echo "::error::$(sed -z 's/\n/%0A/g' analyze.log)"
          fi
          exit "$code"

      - name: Tests
        run: flutter test --coverage --reporter expanded

      - name: Coverage hochladen
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - run: bash scripts/ensure_platforms.sh
      - run: flutter build apk --debug --dart-define=FLAVOR=dev

      - uses: actions/upload-artifact@v4
        with:
          name: neurohelp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS (ohne Signing)
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - run: bash scripts/ensure_platforms.sh
      - run: flutter build ios --debug --no-codesign --dart-define=FLAVOR=dev
