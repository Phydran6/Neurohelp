name: Deploy

# Verteilung an die Tester-Kanäle:
#   Android -> Google Play, Track aus vars.PLAY_TRACK (Standard "internal")
#   iOS     -> TestFlight
#
# Läuft automatisch nach einem erfolgreichen Release oder manuell.
# Ohne hinterlegte Store-Secrets werden die Schritte sauber übersprungen.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Zielplattform"
        required: true
        default: both
        type: choice
        options: [both, android, ios]

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Google Play
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'both' || inputs.target == 'android') ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Nach einem Release genau den getaggten Commit bauen. Ohne `ref`
      # checkt workflow_run den neuesten Stand von main aus – nicht das,
      # was released wurde.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Play-Secrets vorhanden?
        id: gate
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON fehlt – Deploy übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE_BASE64" ]; then
            # Play nimmt nur mit dem Upload-Key signierte Bundles an. Ohne
            # Keystore wuerde mit dem Debug-Key gebaut und Play lehnt ab.
            echo "::error::ANDROID_KEYSTORE_BASE64 fehlt – ohne Upload-Key kein Play-Upload."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v6
        if: steps.gate.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ok == 'true'
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Plattform-Ordner sicherstellen
        if: steps.gate.outputs.ok == 'true'
        run: |
          bash scripts/ensure_platforms.sh
          flutter pub get

      - name: Signing-Dateien schreiben
        if: steps.gate.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "$PLAY_JSON" > android/play-service-account.json

      - name: Bauen & hochladen
        if: steps.gate.outputs.ok == 'true'
        run: |
          flutter pub get
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d'+' -f1)
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=FLAVOR=prod \
            --dart-define=APP_VERSION="$version" \
            --dart-define=APP_BUILD_NUMBER="${{ github.run_number }}"
          cd android
          gem install fastlane --no-document
          fastlane upload
        env:
          # Repository-Variablen (Settings → Secrets and variables → Actions
          # → Variables). Ohne Angabe: internal + completed.
          #   PLAY_TRACK: internal | alpha (geschlossener Test)
          #   PLAY_RELEASE_STATUS: completed | draft
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

  ios:
    name: TestFlight
    runs-on: macos-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'both' || inputs.target == 'ios') ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Nach einem Release genau den getaggten Commit bauen. Ohne `ref`
      # checkt workflow_run den neuesten Stand von main aus – nicht das,
      # was released wurde.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Apple-Secrets vorhanden?
        id: gate
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          if bash scripts/check_apple_secrets.sh --soft; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple-Zugang unvollstaendig – TestFlight-Deploy uebersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ok == 'true'
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Zugriff auf das match-Repository
        if: steps.gate.outputs.ok == 'true'
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          bash scripts/check_match_repo.sh
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Bauen & an TestFlight schicken
        if: steps.gate.outputs.ok == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          flutter pub get
          bash scripts/ensure_platforms.sh
          flutter pub get

          # Version aus der pubspec.yaml holen und den Vorabzusatz abschneiden.
          # Ohne das uebernimmt der Build `0.1.0-alpha.4` als
          # CFBundleShortVersionString, und App Store Connect lehnt den Upload
          # mit ITMS-90060 ab: erlaubt sind nur Ziffern und drei Punkte.
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d'+' -f1)
          ios_version="${version%%-*}"
          echo "pubspec: $version -> iOS: $ios_version"

          gem install fastlane --no-document

          # Ueber das Skript, nicht direkt: Es fasst einen Fehler als
          # Annotation zusammen. Die Protokolle eines Laufs sind nur nach
          # Anmeldung lesbar, Annotationen stehen auf der Zusammenfassung.
          bash scripts/run_fastlane.sh beta \
            version:"$ios_version" \
            build_number:"${{ github.run_number }}"
