name: iOS Signatur einrichten

# Einmalig von Hand starten: Actions -> "iOS Signatur einrichten" -> Run workflow.
#
# Erzeugt bei Apple ein Distributions-Zertifikat und ein App-Store-Profil fuer
# will.neurohelp.help und legt beides verschluesselt ins match-Repository.
# Danach braucht es diesen Lauf nie wieder – Release und Deploy holen die
# Signatur dort nur noch ab.
#
# Ein eigener Mac ist nicht noetig: Der GitHub-Runner ist einer.

on:
  workflow_dispatch:

jobs:
  signing:
    name: Zertifikat und Profil erzeugen
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets vollstaendig?
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: bash scripts/check_apple_secrets.sh

      - name: Zugriff auf das match-Repository
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          # match klont das Zertifikats-Repository per HTTPS.
          git config --global url."https://x-access-token:$MATCH_GIT_TOKEN@github.com/".insteadOf "https://github.com/"
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

          if git ls-remote "$MATCH_GIT_URL" >/dev/null 2>&1; then
            echo "Zugriff auf das Zertifikats-Repository steht."
          else
            echo "::error::Kein Zugriff auf MATCH_GIT_URL. Token abgelaufen, kein Contents-Schreibrecht, oder URL falsch."
            exit 1
          fi

      - name: Inhalt des Zertifikats-Repositorys
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          # Zeigt, ob dort schon etwas liegt. Liegt etwas drin, MUSS
          # MATCH_PASSWORD genau das von damals sein - ein neues Passwort kann
          # bestehende Dateien nicht entschluesseln.
          rm -rf /tmp/matchcheck
          git clone --depth 1 --quiet "$MATCH_GIT_URL" /tmp/matchcheck
          if [ -z "$(ls -A /tmp/matchcheck | grep -v '^\.git$')" ]; then
            echo "Repository ist leer – match legt Zertifikat und Profil neu an."
          else
            echo "Repository enthaelt schon Dateien:"
            find /tmp/matchcheck -type f -not -path '*/.git/*' | sed 's|/tmp/matchcheck/||'
            echo "::warning::MATCH_PASSWORD muss dasselbe sein wie beim Anlegen dieser Dateien."
          fi

      - name: Signatur erzeugen
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          cd ios
          gem install fastlane --no-document
          fastlane setup_signing
