name: Release

# Auslöser: Tag im Format v1.2.3 pushen.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Ergebnis: signiertes AAB + APK, iOS-IPA (falls Secrets gesetzt),
# GitHub-Release mit den Changelog-Notizen zur Version.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v-Präfix, z.B. 0.1.0"
        required: true

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  prepare:
    name: Version & Release Notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      ios_version: ${{ steps.v.outputs.ios_version }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Version bestimmen
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Apple erlaubt in CFBundleShortVersionString nur Ziffern und
          # höchstens drei Punkte. `0.1.0-alpha.4` lehnt App Store Connect mit
          # ITMS-90060 ab, Android nimmt es dagegen anstandslos. Für iOS wird
          # der Vorabzusatz deshalb abgeschnitten: 0.1.0-alpha.4 -> 0.1.0
          #
          # Verwechslungsgefahr gibt es nicht: Innerhalb einer Version
          # unterscheidet die Build-Nummer die Uploads, und die zaehlt mit
          # jedem CI-Lauf hoch.
          echo "ios_version=${version%%-*}" >> "$GITHUB_OUTPUT"
          echo "Android: $version / iOS: ${version%%-*}"

      - name: Release Notes aus CHANGELOG extrahieren
        run: bash scripts/extract_changelog.sh "${{ steps.v.outputs.version }}" > RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  android:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Plattform-Ordner sicherstellen
        run: |
          bash scripts/ensure_platforms.sh
          # Erneut auflösen: Die Plugin-Registrierung entsteht erst, wenn
          # der Plattform-Ordner existiert.
          flutter pub get

      - name: Keystore & key.properties schreiben
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Android-Keystore hinterlegt – es wird unsigniert (Debug-Key) gebaut."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get

      - name: AAB bauen
        run: |
          flutter build appbundle --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}" \
            --dart-define=FLAVOR=prod \
            --dart-define=APP_VERSION="${{ needs.prepare.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"

      - name: APK bauen
        run: |
          flutter build apk --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}" \
            --dart-define=FLAVOR=prod \
            --dart-define=APP_VERSION="${{ needs.prepare.outputs.version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"

      - name: Artefakte benennen
        run: |
          # Sprechende Namen: Man soll am Dateinamen sehen, was man geladen
          # hat - Programm, Version und wofuer es gedacht ist.
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             "release/Neurohelp-${v}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "release/Neurohelp-${v}-android-playstore.aab"
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*

  ios:
    name: iOS Release Build
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - run: bash scripts/ensure_platforms.sh
      - run: flutter pub get

      - name: Signing verfügbar?
        id: signing
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          # Alle sechs pruefen, nicht nur eines. Fehlte bisher nur der
          # Git-Token, lief der Ablauf weiter und scheiterte spaeter mit
          # "could not read Password" - das liest sich wie ein falsches
          # MATCH_PASSWORD und ist etwas voellig anderes.
          if bash scripts/check_apple_secrets.sh --soft; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple-Zugang unvollstaendig – iOS wird nur unsigniert gebaut."
          fi

      - name: Unsigniert bauen
        if: steps.signing.outputs.available == 'false'
        run: |
          # ios_version, nicht version: Apple nimmt kein `-alpha.N`.
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.prepare.outputs.ios_version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}" \
            --dart-define=FLAVOR=prod \
            --dart-define=APP_VERSION="${{ needs.prepare.outputs.ios_version }}" \
            --dart-define=APP_BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"

          # Ohne Apple-Zugang gibt es kein installierbares IPA. Damit trotzdem
          # etwas Greifbares im Release liegt, wird die gebaute App als
          # unsigniertes IPA verpackt - zum Signieren oder Sideloaden.
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry "Neurohelp-${{ needs.prepare.outputs.version }}-ios-unsigniert.ipa" Payload
          rm -rf Payload

      - name: Zugriff auf das match-Repository
        if: steps.signing.outputs.available == 'true'
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          # Gleich hier pruefen, statt es fastlane 20 Minuten spaeter
          # herausfinden zu lassen. Das Skript unterscheidet Tippfehler in der
          # URL, abgelaufenen Token und fehlendes Schreibrecht.
          bash scripts/check_match_repo.sh

          # Ohne das wartet git bei fehlendem Zugriff auf eine Eingabe und
          # meldet dann "could not read Password" - eine Meldung, die auf die
          # falsche Spur fuehrt.
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      - name: Signiertes IPA bauen
        if: steps.signing.outputs.available == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          gem install fastlane --no-document
          bash scripts/run_fastlane.sh build_release \
            version:"${{ needs.prepare.outputs.ios_version }}" \
            build_number:"${{ needs.prepare.outputs.build_number }}"

      - name: Signiertes IPA benennen
        if: steps.signing.outputs.available == 'true'
        run: |
          # `flutter build ipa` nennt die Datei nach dem Projekt: neurohelp.ipa.
          # Im Release soll am Namen stehen, was drin ist - und vor allem, dass
          # das ein App-Store-Build ist, den man nicht sideloaden kann.
          v="${{ needs.prepare.outputs.version }}"
          mv build/ios/ipa/neurohelp.ipa \
             "build/ios/ipa/Neurohelp-${v}-ios-appstore.ipa"
          ls -lh build/ios/ipa/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore

  publish:
    name: GitHub Release veröffentlichen
    runs-on: ubuntu-latest
    needs: [prepare, android, ios]
    # Android muss stehen. iOS darf fehlen - ohne Apple-Zugang wird dort nur
    # unsigniert gebaut, das soll das Release nicht blockieren.
    if: always() && needs.android.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Neurohelp v${{ needs.prepare.outputs.version }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ startsWith(needs.prepare.outputs.version, '0.') }}
          files: |
            artifacts/android-release/*.apk
            artifacts/android-release/*.aab
            artifacts/ios-release/*.ipa
