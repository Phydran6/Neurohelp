name: neurohelp
description: "Neurohelp – native Android & iOS App auf Basis von Flutter."
publish_to: "none"

# version: <semver>+<buildnumber>
# Der Build-Nummer-Teil wird in der CI automatisch durch die GitHub-Run-Nummer ersetzt.
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
