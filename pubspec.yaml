name: neurohelp
description: "Neurohelp – native Android & iOS App auf Basis von Flutter."
publish_to: "none"

# version: <semver>+<buildnumber>
# Der Build-Nummer-Teil wird in der CI automatisch durch die GitHub-Run-Nummer ersetzt.
#
# Der Zusatz `-alpha.N` ist Absicht und bleibt so lange stehen, bis die App
# wirklich für fremde Geräte taugt. Er landet im Namen der App-Version und ist
# damit auf dem Gerät sichtbar.
version: 0.1.0-alpha.8+1

environment:
  # Ab 3.8 formatiert `dart format` im neuen ("tall") Stil. Die Untergrenze
  # bestimmt den Stil – sie muss zwischen lokal und CI gleich sein, sonst
  # scheitert die Formatprüfung obwohl der Code formatiert ist.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  crypto: ^3.0.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.0
  local_auth: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  # Für „Sicherungsdatei speichern": Das System-Blatt lässt den User selbst
  # entscheiden, wohin – Dateien, Passwort-Manager, Cloud. Ein eigener
  # Speicherort wäre auf Android app-privat und damit unauffindbar.
  share_plus: ^10.1.4
  sqflite: ^2.3.0
  supabase_flutter: ^2.17.1
  url_launcher: ^6.3.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  image: ^4.9.1
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# App-Icons erzeugen. Die Quelldateien entstehen aus dem Original über
# `dart run tool/make_icons.dart` – erst danach hier weitermachen:
#
#   dart run flutter_launcher_icons
#
# Die erzeugten Dateien liegen in android/ und ios/ und werden mit
# eingecheckt, damit die CI kein zusätzliches Werkzeug braucht.
flutter_launcher_icons:
  # iOS rundet selbst und verträgt keine Transparenz – deshalb die randlose,
  # deckende Fassung.
  image_path: "assets/icons/app_icon_square.png"

  android: true
  ios: true
  remove_alpha_ios: true

  # Adaptives Icon: Android schneidet je nach Gerät Kreis, Quadrat oder
  # Squircle heraus. Der Vordergrund ist deshalb eingerückt.
  adaptive_icon_background: "#0A1331"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
